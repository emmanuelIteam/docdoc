name: Release

# A pushed version tag is the only trigger: its name becomes the image tag and
# the release identifier. Everything else (branches, pull requests, manual
# runs) stays out of the release path.
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

# Two runs on the same tag must never deploy concurrently. A re-run after a
# failed deployment replaces the previous attempt instead of racing it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: emmanuel7044/docdoc
  # Pinned: the CLI's `container container` commands are stable, but an
  # unpinned download would make the pipeline depend on whatever is latest.
  SCW_CLI_VERSION: '2.65.2'

jobs:
  prepare:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Validate the release version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error title=Invalid release tag::${tag} is not a release version. Expected 1.2 or 1.2.3 (digits and dots only: no v prefix, no suffix)."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish the image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out the tagged sources
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `APP_VERSION` travels into the image's asset stage, which stamps it into
      # the service worker cache version. Single amd64 image, no attestations:
      # the Serverless Container pulls a plain image, not a manifest list.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.tag }}
          tags: ${{ needs.prepare.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the Scaleway container
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # `scw` resolves its organization even for container commands, and a
      # fresh runner has no ~/.config/scw/config.yaml. Without these two, the
      # CLI stops with "Organization ID is required". On this account the
      # default project and the organization share the same identifier.
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID || vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION || 'fr-par' }}
      SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      APP_URL: ${{ vars.APP_URL }}
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Check the deployment configuration
        run: |
          set -euo pipefail
          missing=0
          for name in SCW_ACCESS_KEY SCW_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing secret::Repository secret ${name} is not set."
              missing=1
            fi
          done
          for name in SCW_DEFAULT_PROJECT_ID SCW_CONTAINER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing variable::Repository variable ${name} is not set."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install the Scaleway CLI
        run: |
          set -euo pipefail
          url="https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          curl -fsSL "$url" -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw
          scw version

      - name: Point the container to the new image
        run: |
          set -euo pipefail
          scw container container update "$SCW_CONTAINER_ID" image="$IMAGE"

      # The update returns as soon as the new revision is accepted; the
      # container then pulls the image. Only `ready` on the expected reference
      # proves the rollout finished.
      - name: Wait until the container is ready on the new image
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(scw container container get "$SCW_CONTAINER_ID" -o json)"
            status="$(printf '%s' "$state" | jq -r '.status // empty')"
            image="$(printf '%s' "$state" | jq -r '.image // empty')"
            last="status=${status:-unknown} image=${image:-unknown}"
            if [ "$status" = "ready" ] && [ "$image" = "$IMAGE" ]; then
              echo "Container ready on ${IMAGE}"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Scaleway deployment timed out::Container did not become ready on ${IMAGE} within 10 minutes (last observed: ${last})."
          exit 1

      # `/sw.js` is served with Cache-Control: no-cache and carries the release
      # tag in CACHE_VERSION, so it proves which image actually answers.
      - name: Verify the served release
        id: verify
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL is not defined: the served-release check is skipped."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected="CACHE_VERSION = '${TAG}';"
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS --max-time 10 "${APP_URL%/}/sw.js" || true)"
            if printf '%s' "$body" | grep -Fq "$expected"; then
              echo "The served worker declares ${expected}"
              echo "result=verified" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Stale version served::${APP_URL}/sw.js does not declare ${expected} within 2 minutes."
          exit 1

      - name: Summarise the release
        if: always()
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
        run: |
          {
            echo "## Release ${TAG}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Digest | \`${DIGEST:-unknown}\` |"
            echo "| Container | \`${SCW_CONTAINER_ID}\` |"
            echo "| Served release | ${VERIFY_RESULT:-not checked} |"
          } >> "$GITHUB_STEP_SUMMARY"
